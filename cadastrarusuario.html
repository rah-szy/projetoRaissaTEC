<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow p-4">

        <h4 class="text-center mb-4">Cadastro de Usuário</h4>

        <form>

          <div class="mb-3">
            <label class="form-label">Digite seu nome:</label>
            <input type="text" class="form-control">
          </div>

          <div class="mb-3">
            <label class="form-label">Digite seu email:</label>
            <input type="email" class="form-control">
            <div class="form-text">Nunca compartilharemos seu e-mail com mais ninguém.</div>
          </div>

          <div class="mb-3">
            <label class="form-label">Que tipo de usuário você é?</label>
            <select class="form-select">
              <option selected>-</option>
              <option value="1">ADMIN</option>
              <option value="2">Técnico</option>
              <option value="3">Vendedor</option>
              <option value="4">Recepção</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Escolha uma senha segura:</label>
            <input type="password" class="form-control">
          </div>

         

          <button type="submit" class="btn btn-primary w-100">Cadastrar</button>

        </form>

      </div>
